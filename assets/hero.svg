<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">TEOCHEW PEOPLE</title>
  <desc id="hero-desc">A monumental Teochew coastal city at blue hour, carrying the title TEOCHEW PEOPLE.</desc>
  <defs>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061522" stop-opacity="0.58"/>
      <stop offset="0.48" stop-color="#061522" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#061522" stop-opacity="0.66"/>
    </linearGradient>
    <radialGradient id="focus" cx="50%" cy="49%" r="62%">
      <stop offset="0" stop-color="#061522" stop-opacity="0.05"/>
      <stop offset="0.56" stop-color="#061522" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#020a10" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="title-shadow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blur"/>
      <feOffset dy="5" result="offset"/>
      <feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.01 0 0 0 0 0.04 0 0 0 0 0.07 0 0 0 0.82 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="hero-background.png" xlink:href="hero-background.png" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#veil)"/>
  <rect width="1600" height="900" fill="url(#focus)"/>
  <text x="800" y="424" text-anchor="middle" dominant-baseline="middle" aria-label="TEOCHEW PEOPLE"
        fill="#F4F0E6" filter="url(#title-shadow)"
        font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700"
        letter-spacing="16"><tspan x="800" y="424">TEOCHEW</tspan><tspan x="800" y="552">PEOPLE</tspan></text>
</svg>
