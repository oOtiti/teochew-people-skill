<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">《给阿嬷的情书》写作案例</title>
  <desc id="desc">A restrained before-and-after teaching graphic showing how source-grounded Teochew context improves a generic film comment.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061522"/>
      <stop offset="0.58" stop-color="#0A2231"/>
      <stop offset="1" stop-color="#0D2D3E"/>
    </linearGradient>
    <linearGradient id="after-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102F40"/>
      <stop offset="1" stop-color="#16394A"/>
    </linearGradient>
    <filter id="panel-shadow" x="-12%" y="-16%" width="124%" height="132%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#02080D" flood-opacity="0.42"/>
    </filter>
    <style>
      .sans { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .salt { fill: #F4F0E6; }
      .mist { fill: #AFC2C8; }
      .muted { fill: #8199A2; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 3px; }
      .headline { font-size: 34px; font-weight: 700; letter-spacing: 0.5px; }
      .subhead { font-size: 17px; font-weight: 400; }
      .panel-label { font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .quote { font-size: 23px; font-weight: 600; }
      .body { font-size: 17px; font-weight: 400; }
      .body-strong { font-size: 18px; font-weight: 700; }
      .lens { font-size: 16px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#sea)"/>
  <rect x="0" y="0" width="12" height="720" fill="#C34B38"/>

  <g class="sans">
    <text x="64" y="62" class="eyebrow" fill="#D7A84B">SOURCE → WIKI → OUTPUT</text>
    <text x="64" y="108" class="headline salt">《给阿嬷的情书》：从泛泛影评到地方经验</text>
    <text x="64" y="140" class="subhead mist">原始资料经来源分级与主题页整理后，转化为可用于写作和视频的场景细节。</text>

    <g filter="url(#panel-shadow)">
      <rect x="64" y="182" width="422" height="454" rx="10" fill="#0C202D" stroke="#35505C"/>
      <rect x="794" y="182" width="422" height="454" rx="10" fill="url(#after-panel)" stroke="#54717B"/>
    </g>

    <rect x="64" y="182" width="422" height="6" rx="3" fill="#C34B38"/>
    <text x="92" y="229" class="panel-label" fill="#E47A69">SOURCE GAP · 泛化表达</text>
    <line x1="92" y1="251" x2="458" y2="251" stroke="#35505C"/>

    <text x="92" y="305" class="quote salt">“潮汕方言亲情片”</text>
    <text x="92" y="353" class="quote salt">“潮汕人很重家庭”</text>
    <text x="92" y="401" class="quote salt">“地方特色，很感人”</text>

    <rect x="92" y="454" width="366" height="112" rx="6" fill="#142A36"/>
    <text x="116" y="490" class="body-strong" fill="#E47A69">问题</text>
    <text x="116" y="523" class="body mist">标签很满，细节很少；</text>
    <text x="116" y="551" class="body mist">侨批、下南洋与乡音都被略过。</text>

    <text x="640" y="211" text-anchor="middle" class="panel-label" fill="#D7A84B">TOPIC WIKI</text>
    <line x1="640" y1="234" x2="640" y2="556" stroke="#D7A84B" stroke-width="2" stroke-opacity="0.55"/>

    <g>
      <circle cx="640" cy="291" r="7" fill="#C34B38"/>
      <rect x="519" y="265" width="242" height="52" rx="26" fill="#0D2A3A" stroke="#4F6B76"/>
      <text x="640" y="297" text-anchor="middle" class="lens salt">侨批 · 钱与信一起回家</text>
    </g>
    <g>
      <circle cx="640" cy="394" r="7" fill="#D7A84B"/>
      <rect x="519" y="368" width="242" height="52" rx="26" fill="#0D2A3A" stroke="#4F6B76"/>
      <text x="640" y="400" text-anchor="middle" class="lens salt">阿嬷 · 代际情感入口</text>
    </g>
    <g>
      <circle cx="640" cy="497" r="7" fill="#AFC2C8"/>
      <rect x="519" y="471" width="242" height="52" rx="26" fill="#0D2A3A" stroke="#4F6B76"/>
      <text x="640" y="503" text-anchor="middle" class="lens salt">乡音 · 不可替代的亲近</text>
    </g>

    <rect x="794" y="182" width="422" height="6" rx="3" fill="#D7A84B"/>
    <text x="822" y="229" class="panel-label" fill="#E7C779">OUTPUT · 有据可写</text>
    <line x1="822" y1="251" x2="1188" y2="251" stroke="#54717B"/>

    <text x="822" y="302" class="body-strong salt">输出不再只是“感人”</text>
    <text x="822" y="350" class="body mist">远方如何借一封侨批回到家；</text>
    <text x="822" y="388" class="body mist">阿嬷如何成为代际记忆的入口；</text>
    <text x="822" y="426" class="body mist">乡音如何保存不可替代的亲密；</text>
    <text x="822" y="464" class="body mist">汕、潮、揭与海外潮人如何同场。</text>

    <rect x="822" y="512" width="366" height="54" rx="6" fill="#D7A84B" fill-opacity="0.12" stroke="#D7A84B" stroke-opacity="0.52"/>
    <text x="1005" y="546" text-anchor="middle" class="body-strong" fill="#F1D89A">具体细节，必须回到来源与地方差异</text>

    <line x1="64" y1="676" x2="1216" y2="676" stroke="#35505C"/>
    <text x="64" y="703" class="eyebrow muted">知识建设系统 · 来源分级 / 主题索引 / 生产细节</text>
  </g>
</svg>
