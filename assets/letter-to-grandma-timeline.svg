<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">《给阿嬷的情书》公开传播时间线</title>
  <desc id="desc">从2023年备案到2026年中国上映、北京展映与马来西亚和新加坡放映的编辑时间线。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="0.55" stop-color="#0d3551"/>
      <stop offset="1" stop-color="#120f18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4d58d"/>
      <stop offset="0.55" stop-color="#e65a3f"/>
      <stop offset="1" stop-color="#f4d58d"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="130" r="260" fill="#e65a3f" opacity="0.08"/>
  <circle cx="240" cy="760" r="320" fill="#4aa3b8" opacity="0.08"/>
  <text x="110" y="120" fill="#f8f2e3" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="50" font-weight="700">一封信进入公共空间</text>
  <text x="112" y="166" fill="#a9c7d1" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="22" letter-spacing="2">备案 · 上映 · 展映 · 原音与字幕</text>
  <line x1="160" y1="465" x2="1440" y2="465" stroke="url(#line)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif">
    <g transform="translate(170 0)">
      <circle cx="0" cy="465" r="20" fill="#f4d58d"/>
      <rect x="-58" y="245" width="270" height="155" rx="18" fill="#102f45" stroke="#376985"/>
      <text x="-28" y="290" fill="#f4d58d" font-size="22" font-weight="700">2023 · 备案</text>
      <text x="-28" y="330" fill="#f8f2e3" font-size="25">国家电影局</text>
      <text x="-28" y="368" fill="#a9c7d1" font-size="18">片名 / 编剧 / 备案单位</text>
    </g>
    <g transform="translate(475 0)">
      <circle cx="0" cy="465" r="20" fill="#e65a3f"/>
      <rect x="-66" y="515" width="275" height="155" rx="18" fill="#2a1c24" stroke="#8f4339"/>
      <text x="-36" y="560" fill="#f4d58d" font-size="22" font-weight="700">2026 · 04 · 30</text>
      <text x="-36" y="600" fill="#f8f2e3" font-size="25">中国上映</text>
      <text x="-36" y="638" fill="#d4a79c" font-size="18">版权预警同步标明边界</text>
    </g>
    <g transform="translate(795 0)">
      <circle cx="0" cy="465" r="20" fill="#f4d58d"/>
      <rect x="-70" y="245" width="295" height="155" rx="18" fill="#102f45" stroke="#376985"/>
      <text x="-40" y="290" fill="#f4d58d" font-size="22" font-weight="700">2026 · 05 · 16—17</text>
      <text x="-40" y="330" fill="#f8f2e3" font-size="25">展映 / 座谈 / 访谈</text>
      <text x="-40" y="368" fill="#a9c7d1" font-size="18">主创说法仍需归因</text>
    </g>
    <g transform="translate(1115 0)">
      <circle cx="0" cy="465" r="20" fill="#e65a3f"/>
      <rect x="-80" y="515" width="285" height="155" rx="18" fill="#2a1c24" stroke="#8f4339"/>
      <text x="-50" y="560" fill="#f4d58d" font-size="22" font-weight="700">2026 · 06 · 18</text>
      <text x="-50" y="600" fill="#f8f2e3" font-size="25">马来西亚 / 新加坡</text>
      <text x="-50" y="638" fill="#d4a79c" font-size="18">潮语 · 字幕 · 配音</text>
    </g>
    <g transform="translate(1430 0)">
      <circle cx="0" cy="465" r="20" fill="#f4d58d"/>
      <rect x="-245" y="245" width="280" height="155" rx="18" fill="#102f45" stroke="#376985"/>
      <text x="-215" y="290" fill="#f4d58d" font-size="22" font-weight="700">2026 · 07 · 03—12</text>
      <text x="-215" y="330" fill="#f8f2e3" font-size="25">新加坡原音加场</text>
      <text x="-215" y="368" fill="#a9c7d1" font-size="18">数字只属报道时点</text>
    </g>
  </g>
  <text x="110" y="820" fill="#7896a4" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18">原创编辑时间线 · 核验日 2026-08-15 · 事件、报道与权利日期不互换</text>
</svg>
